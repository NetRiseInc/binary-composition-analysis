name: 'NetRise Binary Composition Analysis'
description: 'Analyze a binary for composition and identify potential security issues.'
branding:
  icon: 'arrow-up-circle'
  color: 'red'
inputs:
  domain:
    description: 'Auth0 domain (e.g., https://authn.turbine.netrise.io). Do not use a full /oauth/token URL.'
    required: true
  client-secret:
    description: 'auth0 client secret'
    required: true
  audience:
    description: 'auth0 audience'
    required: true
  client-id:
    description: 'auth0 client id'
    required: true
  organization-id:
    description: 'NetRise Organization ID'
    required: true
  endpoint:
    description: 'API endpoint'
    required: true

  artifact-path:
    description: 'Path to the software artifact to upload to NetRise (relative to the job workspace, or absolute)'
    required: true
  name:
    description: 'Asset name'
    required: true
  manufacturer:
    description: 'Asset manufacturer'
    required: false
  model:
    description: 'Asset model'
    required: false
  version:
    description: 'Asset version'
    required: false

outputs:
  upload-id:
    description: 'Unique upload ID for this upload operation'
    value: ${{ steps.submit-artifact.outputs.upload-id }}
  uploaded:
    description: 'Boolean indicating if the upload is complete'
    value: ${{ steps.submit-artifact.outputs.uploaded }}
  asset-id:
    description: "The asset's ID in the system"
    value: ${{ steps.submit-artifact.outputs.asset-id }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: ${{ github.action_path }}/requirements.txt

    - name: Submit Artifact
      id: submit-artifact
      run: |
        pip install -r "${{ github.action_path }}/requirements.txt"
        python "${{ github.action_path }}/action.py"
      shell: bash
      env:
        # auth inputs
        DOMAIN: ${{ inputs.domain }}
        CLIENT_SECRET: ${{ inputs.client-secret }}
        AUDIENCE: ${{ inputs.audience }}
        CLIENT_ID: ${{ inputs.client-id }}
        ORGANIZATION_ID: ${{ inputs.organization-id }}
        ENDPOINT: ${{ inputs.endpoint }}

        # asset inputs
        ARTIFACT_PATH: ${{ inputs.artifact-path }}
        NAME: ${{ inputs.name }}
        MANUFACTURER: ${{ inputs.manufacturer }}
        MODEL: ${{ inputs.model }}
        VERSION: ${{ inputs.version }}
